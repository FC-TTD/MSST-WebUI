services:
  msst-ui:
    image: msst-ui:latest
    build: . 
    restart: always
    ports:
      - 8662:7860
    volumes:
      - ./root:/root
      #- ./pretrain/All_Models:/app/pretrain
      - /TTD-Data/msst/pretrain/All_Models:/app/pretrain
      - /TTD:/TTD  # 挂载整个TTD目录以支持项目级处理
      - /TTD/04_应用/msst/INPUT:/app/input  # 保持兼容性
      - /TTD/04_应用/msst/INPUT_BATCH:/app/input_batch
      - /TTD/04_应用/msst/OUTPUT:/app/results  # 保持兼容性
    container_name: msst
    environment:
      - LANG=zh_CN.UTF-8
      - LANGUAGE=zh_CN.UTF-8
      - LC_ALL=zh_CN.UTF-8
      - TZ=Asia/Shanghai
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ "2" ]
              capabilities: [gpu]
    tty: true
    stdin_open: true